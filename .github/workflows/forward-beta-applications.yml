name: Forward beta tester applications to private review

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - ".github/workflows/forward-beta-applications.yml"

permissions:
  issues: write

concurrency:
  group: forward-beta-application-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  forward:
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, '[Beta Application]: ')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Forward application reference to private review queue
        env:
          PRIVATE_DISPATCH_TOKEN: ${{ secrets.IRONWOVEN_PRIVATE_DISPATCH_TOKEN }}
          PRIVATE_DISPATCH_URL: ${{ secrets.IRONWOVEN_PRIVATE_DISPATCH_URL }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          token = os.environ.get("PRIVATE_DISPATCH_TOKEN", "").strip()
          if not token:
              sys.exit("Missing Actions secret IRONWOVEN_PRIVATE_DISPATCH_TOKEN.")
          dispatch_url = os.environ.get("PRIVATE_DISPATCH_URL", "").strip()
          if not dispatch_url:
              sys.exit("Missing Actions secret IRONWOVEN_PRIVATE_DISPATCH_URL.")
          parsed = urlsplit(dispatch_url)
          expected = "/repos/alexth110987/Create-IronWoven-Age-of-Industry-Private/dispatches"
          if parsed.scheme != "https" or parsed.netloc != "api.github.com" or parsed.query or parsed.fragment or parsed.path != expected:
              sys.exit("Private dispatch URL does not point to the expected private repository.")

          payload = {
              "event_type": "public-beta-application-submitted",
              "client_payload": {
                  "repository": os.environ["SOURCE_REPOSITORY"],
                  "issue_number": os.environ["ISSUE_NUMBER"],
                  "action": "opened",
              },
          }
          request = urllib.request.Request(
              dispatch_url, data=json.dumps(payload).encode("utf-8"), method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "Ironwoven-Beta-Application-Forwarder",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 204:
                      sys.exit(f"Private dispatch returned unexpected HTTP status {response.status}.")
          except urllib.error.HTTPError as error:
              sys.exit(f"Private application dispatch failed with HTTP {error.code}.")
          print("Application reference forwarded to private review queue.")
          PY

      - name: Explain forwarding failure on the public application
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          payload = {"body": "**Application forwarding needs maintainer attention.** Your application remains open, but the private review item could not be created automatically. The maintainer will check the connection and arrange a manual review."}
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['SOURCE_REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments",
              data=json.dumps(payload).encode("utf-8"), method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "Ironwoven-Beta-Application-Forwarder",
              },
          )
          with urllib.request.urlopen(request, timeout=20):
              pass
          PY
