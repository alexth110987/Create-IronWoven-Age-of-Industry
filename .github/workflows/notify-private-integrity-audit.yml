name: Notify private repository integrity audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Send repository reference to private integrity audit
        env:
          PRIVATE_DISPATCH_TOKEN: ${{ secrets.IRONWOVEN_PRIVATE_DISPATCH_TOKEN }}
          PRIVATE_DISPATCH_URL: ${{ secrets.IRONWOVEN_PRIVATE_DISPATCH_URL }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          expected = "https://api.github.com/repos/alexth110987/Create-IronWoven-Age-of-Industry-Private/dispatches"
          token = os.environ.get("PRIVATE_DISPATCH_TOKEN", "")
          endpoint = os.environ.get("PRIVATE_DISPATCH_URL", "")
          if not token:
              raise SystemExit("Private dispatch token secret is missing.")
          if endpoint != expected:
              raise SystemExit("Private dispatch URL secret does not match the approved private repository endpoint.")

          payload = {
              "event_type": "public-repository-updated",
              "client_payload": {
                  "repository": os.environ["SOURCE_REPOSITORY"],
                  "ref": os.environ["SOURCE_REF"],
                  "sha": os.environ["SOURCE_SHA"],
              },
          }
          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status not in (200, 201, 204):
                      raise SystemExit(f"Private dispatch returned unexpected HTTP status {response.status}.")
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Private dispatch failed with HTTP {exc.code}; response body intentionally withheld.")
          print("Private integrity audit notified with repository, ref, and commit SHA only.")
          PY
