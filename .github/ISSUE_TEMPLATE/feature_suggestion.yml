name: Feature suggestion
description: Suggest an improvement that fits the Create IronWoven project.
title: "[Suggestion]: "
body:
  - type: markdown
    attributes:
      value: |
        This is a public GitHub issue. The title, answers, comments, and attachments are visible immediately. GitHub displays your account as the issue author; a nickname does not hide it.
        Do not include personal contact details, passwords, access tokens, private server addresses, local paths, or private configuration.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: How would this improve the pack?
      description: Explain how it fits engineering, automation, trains, transport, exploration, or building.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ideas or references
      description: Optional links or alternative approaches.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Project direction
      options:
        - label: I understand suggestions are reviewed and are not automatically accepted.
          required: true
        - label: I understand the project does not backport to older Minecraft versions.
          required: true
